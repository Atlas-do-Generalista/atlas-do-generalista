name: Validate IDG and site

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/idg-presentation-buttons"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run test suite
        run: npm test

      - name: Build production site
        run: npm run build
